  <script>
    // Initialize EmailJS
    (function() {
        emailjs.init('xgsgOKac8aiCVuOXr'); // Replace with your User ID
    })();

    // Handle form submission
    document.getElementById('contact-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent default form submission

        //Send the email
        emailjs.sendForm('robomatonix-service', 'template_budw2gr', this)
        .then(function() {
            showNotification('Thanks for contacting us. We will reach out to you shortly.', 'success');
        }, function(error) {
            showNotification('Failed to send email. Error: ' + JSON.stringify(error), 'error');
        });
    });

    function showNotification(message, type) {
    const notification = document.getElementById('notification');
    notification.textContent = message;

    // Change background color based on type
    if (type === 'success') {
        notification.style.backgroundColor = '#4caf50'; // Green
    } else {
        notification.style.backgroundColor = '#f44336'; // Red
    }

    // Show notification
    notification.classList.remove('hidden');
    notification.classList.add('visible');

    // Hide notification after 5 seconds
    setTimeout(() => {
        notification.classList.remove('visible');
        notification.classList.add('hidden');
    }, 5000);
}
</script>
