        "images/events/img23.jpg",
        "images/events/img24.jpg",
        "images/events/img25.jpg",
        "images/events/img26.jpg"
      ],
      videos: [
        "https://youtube.com/shorts/VQYp4LrEABQ?si=rTdnyCl47lK-L7ge", // YouTube video link
        "https://youtube.com/shorts/KPSCKqcaivA?si=My482RCDBOuCSO9N"
      ]
    };

    // Function to load gallery items
    function loadGallery() {
      const galleryVideos = document.getElementById("galleryVideos");
      const galleryImages = document.getElementById("galleryImages");

      // Load YouTube videos
      galleryData.videos.forEach(video => {
        const galleryItem = document.createElement("div");
        galleryItem.classList.add("gallery_item");
        const embedUrl = video.replace("watch?v=", "embed/"); // Convert YouTube URL to embed URL
        galleryItem.innerHTML = `
          <iframe 
            width="100%" 
            height="315" 
            src="${embedUrl}" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>`;
        galleryVideos.appendChild(galleryItem);
      });

      // Load images
      galleryData.images.forEach(image => {
        const galleryItem = document.createElement("div");
        galleryItem.classList.add("gallery_item");
        galleryItem.innerHTML = `<img src="${image}" alt="Event Image">`;
        galleryImages.appendChild(galleryItem);
      });
    }

    // Call the function to load gallery items
    loadGallery();
  </script>
